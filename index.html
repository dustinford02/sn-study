<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow">
<meta name="description" content="Offline single-file reference tool with an encrypted content layer.">
<title>Study Console</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b1020;--card:#151b32;--card2:#1b2240;--tx:#e8ecf8;--mut:#98a2c8;--acc:#5b8cff;--ok:#38d39f;--warn:#ffb454;--bad:#ff6b6b;--pur:#b58cff;--bd:#27304f}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:92px}
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--bd);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px}
.hrow{display:flex;align-items:center;gap:10px;max-width:780px;margin:0 auto}
h1{font-size:16px;margin:0;flex:1;font-weight:700}
h1 small{display:block;font-size:11px;color:var(--mut);font-weight:500}
main{padding:14px;max-width:780px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-weight:600;font-size:14px}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:none}
.btn:focus-visible,.chip:focus-visible,.navb:focus-visible,.iconb:focus-visible,.qh:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.iconb{min-width:44px;min-height:44px;border:1px solid var(--bd);border-radius:12px;background:var(--card2);font-size:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:0 0 12px;overflow:hidden}
.pad{padding:14px}
.note{font-size:13px;color:var(--mut);margin:0 0 12px}
.sec{margin-top:14px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.txt{font-size:14.5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid var(--bd);color:var(--mut);background:var(--card2)}
.chip.sm{padding:2px 7px}
.tk-a{color:#0b1020;background:var(--ok);border-color:var(--ok)}
.tk-b{color:#fff;background:var(--acc);border-color:var(--acc)}
.tk-d{color:#0b1020;background:var(--pur);border-color:var(--pur)}
.tk-c{color:#0b1020;background:var(--warn);border-color:var(--warn)}
.tk-e{color:#fff;background:var(--bad);border-color:var(--bad)}
.sk-a{color:#0b1020;background:var(--ok)}.sk-b{color:#0b1020;background:var(--warn)}
.sk-c{color:#fff;background:var(--bad)}
.prov{font-size:10px;letter-spacing:.06em;border-radius:6px;padding:2px 6px;font-weight:800}
.prov.S{background:#1d3b2f;color:var(--ok);border:1px solid var(--ok)}
.prov.D{background:#3b3220;color:var(--warn);border:1px solid var(--warn)}
.prov.C{background:#1d2b4d;color:var(--acc);border:1px solid var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:30}
.navb{flex:1;color:var(--mut);padding:10px 2px 12px;font-size:10.5px;font-weight:700;min-height:56px}
.navb b{display:block;font-size:18px;font-weight:400;line-height:1.25}
.navb[aria-current="page"]{color:var(--acc)}
.qh{width:100%;text-align:left;padding:13px 14px;display:flex;gap:10px;align-items:flex-start;min-height:44px}
.qh .qt{font-weight:600;font-size:14.5px;flex:1}
.qh .meta{font-size:11px;color:var(--mut);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.num{background:var(--card2);border:1px solid var(--bd);color:var(--mut);border-radius:8px;min-width:36px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:0 0 auto}
.rate{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rate .chip{min-width:44px;min-height:36px;justify-content:center;font-size:13px}
.rate .chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
.twrap{overflow-x:auto}
th,td{border:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--card2);font-size:11.5px}
input[type=text],input[type=search],select{width:100%;min-height:44px;padding:10px 13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.answer{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px;font-size:14.5px}
.answer .ahead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.timer{font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;text-align:center;padding:8px}
.timer.low{color:var(--bad)}
.bar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;background:var(--acc)}
.svgwrap{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-top:8px}
.svgwrap svg{width:100%;height:auto;display:block}
.cap{font-size:12px;color:var(--mut);margin-top:6px}
mark{background:var(--warn);color:#0b1020;border-radius:3px;padding:0 2px}
.hide{display:none!important}
.pathblock{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd);align-items:flex-start}
.pathblock:last-child{border-bottom:0}
.pathblock .min{min-width:52px;text-align:center;font-weight:800;font-size:13px;color:var(--mut);padding-top:2px}
.pathblock.done{opacity:.55}
.pill{font-size:11px;color:var(--mut);border:1px solid var(--bd);border-radius:999px;padding:2px 8px}
.warnbox{border:1px solid var(--warn);background:#2b2413;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.okbox{border:1px solid var(--ok);background:#132b22;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
h2{font-size:15px;margin:18px 0 8px}
h3{font-size:13.5px;margin:0 0 6px}
ul{margin:6px 0 0;padding-left:20px;font-size:14px}
li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}
.checkrow:last-child{border:0}
.checkrow input{width:22px;height:22px;min-height:22px;accent-color:var(--acc);margin-top:2px;flex:0 0 auto}
.checkrow label{font-size:14px}
</style></head><body>
<header><div class="hrow">
<h1 id="htitle">Study Console<small id="hsub">Offline reference tool</small></h1>

</div></header>
<main id="m" aria-live="polite"></main>
<nav id="navbar" class="hide" aria-label="Main">
<button type="button" class="navb" data-v="path" onclick="go('path')"><b>&#128506;</b>Path</button>
<button type="button" class="navb" data-v="questions" onclick="go('questions')"><b>&#10067;</b>Questions</button>
<button type="button" class="navb" data-v="evidence" onclick="go('evidence')"><b>&#9878;</b>Evidence</button>
<button type="button" class="navb" data-v="mock" onclick="go('mock')"><b>&#127908;</b>Mock</button>

</nav>

let injected=false;
function b64d(s){ const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u }
function b64e(buf){ const a=new Uint8Array(buf); let s=""; for(let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s) }
async function deriveKey(pass,salt){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:310000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function unlockWith(key){
 if(injected) return;
 const raw=b64d(SEALED);
 const iv=raw.slice(16,28), ct=raw.slice(28);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
 const src=new TextDecoder().decode(pt);
 const el=document.createElement("script"); el.textContent=src; document.head.appendChild(el);
 injected=true;
 const nb=document.getElementById("navbar"); if(nb) nb.classList.remove("hide");
 const hb=document.getElementById("hdrbtns"); if(hb) hb.classList.remove("hide");
 render();
}
async function doUnlock(){
 const el=document.getElementById("pw"), msg=document.getElementById("umsg"), btn=document.getElementById("ubtn");
 const pass=el.value;
 if(!pass){ msg.textContent="Enter your passphrase."; return }
 msg.textContent="Deriving key, this takes a moment."; btn.disabled=true;
 try{
  const raw=b64d(SEALED), salt=raw.slice(0,16);
  const key=await deriveKey(pass,salt);
  await unlockWith(key);
  try{ const bits=await crypto.subtle.exportKey("raw",key); localStorage.setItem(SKEY,b64e(bits)) }catch(e){}
 }catch(e){
  msg.textContent="That passphrase did not work."; el.value=""; btn.disabled=false;
 }
}
function lockedView(){
 document.getElementById("m").innerHTML =
 '<div class="card"><div class="pad">'
 +'<p class="note" style="margin-bottom:14px">A single-file offline reference tool. The application is encrypted at rest and decrypts in the browser. Without the passphrase there is nothing here to read.</p>'
 +'<label for="pw" class="lbl">Passphrase</label>'
 +'<input type="password" id="pw" autocomplete="current-password" enterkeyhint="go">'
 +'<div style="margin-top:12px"><button type="button" class="btn acc" id="ubtn">Unlock</button></div>'
 +'<div class="note" id="umsg" style="margin:10px 0 0;min-height:20px"></div>'
 +'</div></div>'
 +'<div class="card"><div class="pad">'
 +'<div class="lbl">Colophon</div>'
 +'<ul style="margin-top:8px">'
 +'<li>One HTML file. No dependencies, no build step, no framework.</li>'
 +'<li>No network calls, no analytics, no cookies, no third-party requests.</li>'
 +'<li>Installs as a PWA and runs fully offline from a versioned service-worker cache.</li>'
 +'<li>Sealed with AES-GCM 256. Key derived with PBKDF2-HMAC-SHA256 at 310,000 iterations.</li>'
 +'<li>All state stays in local storage on the device.</li>'
 +'</ul></div></div>';
 const b=document.getElementById("ubtn"); if(b) b.addEventListener("click",doUnlock);
 const i=document.getElementById("pw"); if(i) i.addEventListener("keydown",function(e){ if(e.key==="Enter") doUnlock() });
}
async function boot(){
 let cached=null; try{ cached=localStorage.getItem(SKEY) }catch(e){}
 if(cached){
  try{
   const key=await crypto.subtle.importKey("raw",b64d(cached),{name:"AES-GCM"},true,["decrypt"]);
   await unlockWith(key);
   return;
  }catch(e){ try{ localStorage.removeItem(SKEY) }catch(e2){} }
 }
 lockedView();
}
/* ---------- boot ---------- */
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("./service-worker.js").catch(()=>{}) }) }
boot();
