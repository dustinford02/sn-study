 evidence:[{t:"Federal work arrived through contractually defined task orders, adjacent to demand without owning the module.",tier:"PROD"},{t:"Flow Designer mechanics practiced in the PDI: triggers, conditions, approvals, record and task operations, subflows.",tier:"PDI"},{t:"Documented PDI build: an approval flow with a record trigger, Ask for Approval, If/Else on approval state, and Update Record actions, saved in draft.",tier:"PDI"}],

 a60:"Not in production, and I will say why: on federal task orders, intake was contractual, so I worked adjacent to demand without owning the module. Where I have built the mechanics is my PDI. I built an approval flow in Flow Designer: a record trigger with a condition on the short description, an Ask for Approval action with an explicit approval rule and a named approver, If/Else flow logic reading the approval state, and Update Record actions on both the approved and rejected branches, with work notes on each. It is saved in draft; activation and end-to-end testing are my documented next steps. I have not deployed a production record producer, scoring model, approval flow, or demand-to-project conversion.",
 a120:"Not in production. My federal delivery context did not have a discretionary demand pipeline; work entered through contractually defined task orders, so I sat adjacent to demand without owning the module. What I can speak to hands-on is the build mechanics, from my PDI. I built an approval flow in Flow Designer: trigger type record-created on a table with a condition on the short description; an Ask for Approval action with the record data pill dragged from the data panel, an approval rule of anyone approves, and a named test approver; then If/Else flow logic where the If condition reads the approval state from the approval action's output; on the approved branch an Update Record action sets state and work notes, and the Else branch closes the record with a rejection note. I also learned the small real-world lessons: the Else option only becomes selectable after the If branch exists, data pills enforce type compatibility, and a flow does nothing until you activate it, which for mine is the documented next step along with an end-to-end test. Conceptually, a production demand design would add a record producer for intake, an assessment and scoring stage, and demand-to-project conversion, and I know those from training, not production.",
 maxNote:null,
 followups:["What trigger types does Flow Designer support?","How would you keep an approval from hanging forever?","What is the difference between running a flow as the initiating user versus system user?"],

 evidence:[{t:"CLIN burn and runout, forecasting, funding risk, consolidating prime and subcontractor inputs into decision-ready views.",tier:"PROD"}],
 structure:"Real financial control, then where the system of record actually was, then the boundary.",
 a30:"I have project financial-control experience: CLIN burn and runout, forecasting, funding risk, and consolidating prime and subcontractor inputs into decision-ready views. In that work the native SPM financial objects were not the system of record, and I have not configured cost plans, expense lines, or investment funding records.",
 a60:"Two clean halves. The financial control is real: CLIN-level burn and runout, completion forecasting, funding-cliff mitigation, and consolidating prime and subcontractor inputs into views leadership could decide from; on TDL-064 that discipline showed up as executing 9% below the projected ceiling. The module claim I will not make: native SPM financial objects were not our system of record, and I have not configured cost plans, expense lines, or investment funding records, and I do not claim EVMS or FinOps implementation. Financial-control competence and financial-module configuration are different claims, and I only hold the first.",
 a120:null,
 maxNote:"Sixty seconds is the honest ceiling; module configuration detail would be training material, not experience.",
 followups:["Where did the financial data actually live?","What is a cost plan versus a budget?","How did you forecast runout?"],
 terms:["CLIN","Burn and runout","Cost plan","System of record"],
 avoid:["Implying SPM was the financial system of record","EVMS or FinOps implementation claims"],
 practice:"Say the split sentence: 'Financial control, yes; financial-module configuration, no.'",
 srcs:["Prepared Q7","Resume TDL-064 entry"]},

{id:"a8",bank:"A",band:"Operational",label:"Explain",q:"What SPM dashboards or executive reports have you built?",
 testing:"Your strongest area. The interviewer is checking whether you can reconstruct the build end to end: source data, widget, audience, decision.",
 jd:"Direct JD hit: Reporting is a required module; \"translate ... technical status ... into executive-ready reporting.\"",
 evidence:[{t:"Leadership reporting layer: interactive filters for task order, business unit, contract period; KPIs for open, closed, overdue, near-due milestones; progress views; drill-down into project records; one page serving executives and PMs.",tier:"PROD"}],
 structure:"What you built, who used it, what decision it fed, then the one boundary.",
 a30:"This is my strongest ServiceNow area. I built and maintained a leadership reporting layer: interactive filters for task order, business unit, and contract period; KPIs for open, closed, overdue, and near-due milestones; progress views; and drill-down into project records. Executives and project managers used the same page, with filters changing the view.",
 a60:"This is my strongest area, so let me be concrete. I built and maintained the leadership reporting layer for my program: interactive filters for task order, business unit, and contract period; current-state KPIs for open, closed, overdue, and near-due milestones; progress views; and drill-down from any number on the page into the underlying project records. The design decision I am most deliberate about is that executives and project managers used the same page, with filters changing the view, so there was never a second, stale version of the truth. The boundary: I did not build the production integrations or flow logic feeding those records, and I only claim dashboard elements I can reconstruct end to end: source data, filter or widget, audience, and the decision it supported.",
 a120:"This is my strongest ServiceNow area. The problem it solved: leadership could not compare task completion across contract periods, because status was assembled manually with variable inputs. What I built: first the data discipline, deliverables standardized as weighted milestones inside a consistent WBS with planned dates, because a dashboard is only as good as the records under it; then the reporting layer itself, interactive filters for task order, business unit, and contract period, current-state KPIs for open, closed, overdue, and near-due milestones, progress views, and drill-down from any KPI into the underlying project records. One page served everyone: an executive filtered to a contract period and saw posture; a project manager filtered to their task order and saw their overdue items; same data, same page, no parallel spreadsheet version of the truth. What it changed: reporting became consistent, and funding and schedule risk surfaced earlier, which is qualitative and I will not dress it up with an invented metric. The boundary: the integrations and flow logic feeding those records were not mine, and I hold a personal rule that I only claim a dashboard element if I can reconstruct its whole chain: source data, filter or widget, audience, and the decision it supported.",
 maxNote:null,
 followups:["Pick one KPI and walk its chain from source field to decision.","How did you keep the underlying data honest?","Why filters on one page instead of separate dashboards per audience?"],
 terms:["Interactive filter","KPI widget","Drill-down"],
 avoid:["Claiming the integrations or flow logic behind the data","Inventing a time-saved metric"],
 practice:"Pick the overdue-milestones KPI and say its full chain in 30 seconds.",
 srcs:["Prepared Q8","Prepared Q15"]},

{id:"a9",bank:"A",band:"Operational",label:"Defend",q:"Have you used Performance Analytics for portfolio or delivery metrics?",
 testing:"A trap for dashboard builders: whether KPIs get misrepresented as PA. The strong move is a flat no plus the correct distinction.",
 jd:"Title context; nearest JD line: Reporting module requirement.",
 evidence:[{t:"Report-based widgets on live data with interactive filters, KPIs, and drill-down.",tier:"PROD"},{t:"PA mechanics known from training: indicators, indicator sources, breakdowns, collection jobs, scored snapshots.",tier:"STUDIED"}],
 structure:"The no, first word. Then the distinction. Then stop.",
 a30:"No. My hands-on work is report-based widgets on live data: interactive filters, KPIs, drill-down. Performance Analytics is a different mechanism: indicators, indicator sources, breakdowns, collection jobs, and scored snapshots over time, and I have not defined or administered those objects.",
 a60:"No, and I think the distinction matters enough to state it precisely. Everything I have built is report-based: live queries against current data, presented as KPIs with interactive filters and drill-down. That shows you now. Performance Analytics shows you trend: indicators defined over indicator sources, breakdowns for slicing, collection jobs taking scheduled snapshots, and scores accumulating over time. I have not defined or administered any of those objects. A dashboard full of KPIs is not evidence of Performance Analytics implementation, and I would rather tell you that plainly than let you find it out later.",
 a120:null,
 maxNote:"This answer should stay short. Sixty seconds, delivered cleanly, is stronger than two minutes of theory about a capability you have not used.",
 followups:["Why would we use PA instead of a report?","What is a breakdown?","Could a report show a trend?"],
 terms:["Indicator","Indicator source","Breakdown","Collection job","Scored snapshot"],
 avoid:["Softening the no","Implying your KPI dashboards were PA"],
 practice:"Deliver the no plus distinction in one breath: reports show now, PA shows trend, I built the first.",
 srcs:["Prepared Q9"]},

{id:"a10",bank:"A",band:"Operational",label:"Explain",q:"How have you integrated SPM with ITSM, Agile Development, CMDB, or CSDM?",
 testing:"Integration honesty plus the CSDM-vs-CMDB vocabulary check, the most revealing error available to a bluffer.",
 jd:"Direct JD relevance: \"Hands-on experience with ServiceNow platform integrations and toolsets\"; Configuration Management module.",
 evidence:[{t:"Conceptual understanding of the seams: project tasks and change records, deliverables and configuration items, Agile work linked to project outcomes.",tier:"STUDIED"},{t:"Integration Hub, spokes, actions, and APIs introduced through training and PDI.",tier:"STUDIED"}],
 structure:"Direct no for production, correct concepts including the CSDM point, then the boundary.",
 a30:"Not in production. I understand the seams conceptually: project tasks to change records, deliverables to configuration items, Agile work linked to project outcomes. And I know CSDM is a prescribed CMDB data model, not an integration product. My Integration Hub and API knowledge is training and PDI foundation.",
 a60:"Not in production, so let me tell you exactly what I do have. Conceptually I understand the seams: project tasks connecting to change records for delivery into controlled environments, deliverables tied to configuration items, and Agile stories rolling up to project outcomes. On vocabulary, CSDM is the Common Service Data Model, a prescribed standard for how you populate and relate CMDB data; it is not an application you install or an integration you build, and confusing the two is a real tell. My Integration Hub knowledge, spokes, actions, and APIs, comes from training and PDI work, and I am explicit that training foundation is not production integration engineering.",
 a120:null,
 maxNote:"Sixty seconds is the honest ceiling for a production-integration question answered no; concept depth belongs in follow-ups.",
 followups:["What is a spoke?","CSDM versus CMDB in one sentence each?","What would linking a project deliverable to a CI buy us?"],
 terms:["CSDM","CMDB","Integration Hub","Spoke","Configuration item"],
 avoid:["Calling CSDM an application or integration","Calling a two-table report an integration"],
 practice:"Say the CSDM sentence until it is automatic: CSDM is the model; the CMDB is the data.",
 srcs:["Prepared Q10"]},

{id:"a11",bank:"A",band:"Strategic",label:"Defend",q:"Have you supported roadmap planning, scenario planning, or what-if analysis?",
 testing:"Whether project schedules get dressed up as native strategic-planning capabilities.",
 jd:"Title context; nearest JD line: \"Support ongoing system improvements aligned with mission and customer requirements.\"",
 evidence:[{t:"Timeline and forecasting views from milestone reporting, planned dates, WBS dependencies, funding posture, resource constraints, mitigation courses of action.",tier:"PROD"}],
 structure:"Project-level truth, then the native-feature boundary.",
 a30:"At the project level, yes: timeline and forecasting views built from milestone reporting, planned dates, WBS dependencies, funding posture, resource constraints, and mitigation courses of action. I have not configured native ServiceNow roadmap or scenario-planning features; a project schedule is not a Strategic Planning Workspace.",
 a60:"At the project level. I delivered timeline and forecasting views built from milestone reporting, planned dates, WBS dependencies, funding posture, and resource constraints, and I briefed mitigation courses of action against them, which is genuine forward planning. What I will not call it is native roadmap or scenario planning: I have not configured ServiceNow's roadmap features or a portfolio scenario model, and a well-run project schedule is not a Strategic Planning Workspace. I know the native constructs from training: scenarios as non-destructive alternatives you compare before committing, what-if analysis as constraint-driven simulation, and I keep that as knowledge, not experience.",
 a120:null,
 maxNote:"Sixty seconds covers it honestly.",
 followups:["What is a scenario in the native sense?","What data would what-if analysis need to be computable?","What was a mitigation COA you actually briefed?"],
 terms:["Scenario","What-if analysis","Roadmap","Mitigation COA"],
 avoid:["Calling a Gantt view a roadmap capability","Claiming scenario configuration"],
 practice:"One sentence: 'Project-level forecasting, yes; native scenario tooling, training only.'",
 srcs:["Prepared Q11"]},

{id:"a12",bank:"A",band:"Strategic",label:"Explain",q:"How do you determine when to configure versus customize ServiceNow?",
 testing:"The senior-judgment question: a repeatable decision test, not a slogan.",
 jd:"Direct JD relevance: \"following best practices\"; \"Design and implement solutions.\"",
 evidence:[{t:"Design judgment: configure first, preserve out-of-the-box behavior, customize only with documented justification and accepted upgrade cost.",tier:"STUDIED"},{t:"PDI practice applying it: declarative ACLs, roles, forms, lists, update sets; no baseline code modified.",tier:"PDI"}],
 structure:"The test, the sequence, then where you have applied it.",
 a30:"Configure first and preserve out-of-the-box behavior. I customize only when a documented requirement cannot be met another way and the organization knowingly accepts the maintenance and upgrade cost. My primary test is upgradeability, and where customization is unavoidable I scope it narrowly, document it, and test it.",
 a60:"My primary test is upgradeability. The sequence: does out-of-the-box meet the need; if not, can configuration meet it, meaning forms, fields, roles, ACLs, declarative tools; only if a documented requirement still cannot be met do I customize, and then the organization has to knowingly accept the maintenance and upgrade cost, with the change scoped narrowly, documented, and tested. In my own build work I have lived that: the safety app's whole security model is declarative, roles and ACL records with conditions, no baseline code touched, packaged in an update set so it is reviewable. That is design judgment supported by PDI practice, and I say plainly that it is not production custom-code ownership.",
 a120:null,
 maxNote:"Sixty seconds delivers the framework; more would be padding without a production war story to carry it.",
 followups:["Give an example where customization is justified.","What is the upgrade risk of a modified baseline business rule?","Where does a scoped app sit in that framework?"],
 terms:["Out-of-the-box","Declarative configuration","Upgradeability","Scoped application"],
 avoid:["Dogmatic never-customize","Claiming production custom-code ownership"],
 practice:"Recite the sequence: OOTB, configure, justify, scope, document, test.",
 srcs:["Prepared Q12","PDI ACL lab record"]},

{id:"a13",bank:"A",band:"Strategic",label:"Defend",q:"What ServiceNow certifications do you currently hold?",
 testing:"Category discipline under pressure: courses and badges are not certifications, and the interviewer knows it.",
 jd:"Nearest JD line: Desired \"ServiceNow Certified Application Developer certification.\"",
 evidence:[{t:"Zero ServiceNow certifications. Badges and University course completions only.",tier:"NONE"},{t:"Documented record since July 22, 2026: 21 courses, two learning paths, more than 36 hours; CSA in progress, CIS-SPM next.",tier:"STUDIED"}],
 structure:"The none, first word. Then the documented record. Then the path. Stop.",
 a30:"None. I hold no ServiceNow certifications; I have badges and completed training in ServiceNow University. My documented record since July 22, 2026 is 21 courses, two learning paths, and more than 36 hours, and I am working toward CSA with CIS-SPM planned after it.",
 a60:"None, and I will not blur that line: course completions, learning paths, and badges are training evidence, not certifications. What I do have is a documented record: since July 22, 2026, 21 on-demand courses and two learning paths, more than 36 hours, across administration fundamentals, Flow Designer, access control, Integration Hub, and the platform AI material. The path from here is CSA first, then CIS-SPM. And to keep categories clean: my AI4PI credential is a performance-improvement certification, not a ServiceNow one, and my PMP is project management. Nothing I hold is a ServiceNow certification, and I would rather you hear that from me in the first sentence.",
 a120:null,
 maxNote:"Short and clean wins this question; sixty seconds is the ceiling.",
 followups:["When do you sit CSA?","Why CSA before CIS-SPM?","Are the badges verifiable?"],
 terms:["CSA","CIS-SPM","Badge versus certification"],
 avoid:["'Certified in progress' phrasing","Counting AI4PI or PMP as ServiceNow credentials","Any precise hour total"],
 practice:"First word 'None,' then the record, no apology in the voice.",
 srcs:["Prepared Q13"]},

 evidence:[{t:"Predominantly waterfall, milestone-driven delivery: WBS-decomposed deliverables, weighted milestones, planned end dates, contract-period controls; hybrid in practice via recurring technical demonstrations inside a milestone-governed structure.",tier:"PROD"}],
 structure:"The real delivery model, the honest hybrid nuance, then the module boundary.",
 a30:"My delivery experience is predominantly waterfall and milestone-driven: WBS-decomposed deliverables, weighted milestones, planned end dates, contract-period controls. In practice it was hybrid, because recurring technical demonstrations and evolving work ran inside that milestone-governed structure. I have not configured Agile Development 2.0, a Hybrid project type, or SAFe in ServiceNow.",
 a60:"Predominantly waterfall and milestone-driven, because federal contract structures demand it: WBS-decomposed deliverables, weighted milestones, planned end dates, and contract-period controls. In practice it was hybrid; TDL-064 ran recurring technical demonstrations and evolving delivery work inside that milestone-governed frame, which is the real-world default more than a pure methodology. The platform boundary: I have not configured Agile Development 2.0, a Hybrid project type, or a SAFe implementation in ServiceNow. Practicing hybrid delivery and configuring the modules that support it are different claims, and I only make the first.",
 a120:null,
 maxNote:"Sixty seconds is the honest ceiling.",
 followups:["What did hybrid look like concretely on TDL-064?","What is Agile Development 2.0?","How would story-level work roll up to your milestones?"],
 terms:["Hybrid project type","Agile Development 2.0","Milestone-governed structure"],
 avoid:["Implying SAFe or Agile module configuration","Generic agile theory with no artifacts"],

 srcs:["Prepared Q14"]},

{id:"a15",bank:"A",band:"Strategic",label:"Defend",q:"Can you describe a recent SPM implementation challenge and how you resolved it?",
 testing:"The consistency check on everything before it: a real story, sized to your actual claims, with an honest outcome.",
 jd:"Nearest JD lines: Reporting; \"Support ongoing system improvements aligned with mission and customer requirements.\"",
 evidence:[{t:"Leadership lacked consistent cross-period task completion comparison; manual status with variable inputs. Standardized weighted milestones in a consistent WBS, defined recurring report inputs, built a filterable drill-down dashboard.",tier:"PROD"}],
 structure:"Situation, constraint, action, result, boundary. No invented metric.",
 a30:"Leadership could not compare task completion across contract periods; status was manual with variable inputs. I standardized deliverables as weighted milestones in a consistent WBS, defined recurring report inputs, and built a filterable dashboard with drill-down. Reporting became consistent and funding and schedule risk surfaced earlier.",
 a60:"The challenge: leadership had no consistent way to compare task completion across contract periods. Status was assembled manually with variable inputs, and the data would not compile into a decision-ready view. What I did: standardized deliverables as weighted milestones inside a consistent WBS, defined the recurring report inputs so the same fields fed the same views every period, and built a filterable dashboard with drill-down on top. The result: reporting consistency, and earlier visibility of funding and schedule risk. I will flag the result is qualitative; I have no verified hours-saved metric, and I solved this with standard reporting and configuration, not custom code or an end-to-end implementation.",
 a120:"Situation: on my program, leadership lacked a consistent way to compare task completion across contract periods. Status was assembled manually, inputs varied by contributor, and key data never compiled into one decision-ready view, so every review started with reconciliation instead of decisions. Constraint: I was not going to get an implementation team or custom development; whatever fixed this had to be standard reporting and configuration inside our existing setup. Action, in two layers: first the data, standardizing deliverables as weighted milestones inside a consistent WBS with planned dates, because no dashboard fixes inconsistent records; then the view, defining recurring report inputs and building a filterable dashboard, task order, business unit, contract period, with KPIs for open, closed, overdue, and near-due milestones and drill-down into the records. Result: reporting became consistent across periods, and funding and schedule risk became visible earlier, which changed when mitigation conversations happened. I am deliberate about two boundaries: the result is qualitative, I have no verified hours-saved number and will not invent one; and this was a project-delivery and reporting challenge solved with standard configuration, not an end-to-end SPM implementation. The transferable lesson: standardize the record structure before you build the view, or the view lies.",
 maxNote:null,
 followups:["What resistance did you hit and from whom?","Why weighted milestones specifically?","What would you do differently now?"],
 terms:["Decision-ready view","Recurring report inputs"],
 avoid:["Inventing a quantified outcome","Upgrading the story to an implementation"],
 practice:"Tell the 60-second version aloud, twice, ending on the boundary sentence without trailing off.",
 srcs:["Prepared Q15"]}
];

 a30:"I will take the four verbs honestly. Designing and developing: demonstrated in my PDI, a scoped safety app and an approval flow. Configuring: limited project-level configuration in production, full app configuration in the PDI. Maintaining: the production reporting layer on TDL-064 was mine to keep accurate daily.",
 a60:"Let me place each verb where my evidence actually is. Designing and developing: my demonstrable work is PDI, a scoped App Engine Studio application with a custom table, two roles, and seven ACLs, and an approval flow in Flow Designer, built to be reviewable through an update set. Configuring: in production, limited project-level configuration supporting delivery visibility; in the PDI, the full stack of forms, lists, roles, and access rules. Maintaining: on TDL-064 I maintained the live reporting layer executives and PMs depended on, through contract periods and changing inputs. What I have not done is production development on the platform, and I would rather anchor on demonstrable evidence than stretch a verb.",
 a120:null,maxNote:"Sixty seconds places all four verbs; deeper detail lives in the specific modules that follow.",
 followups:["Which of those four verbs is weakest for you?","Show me the design thinking in the safety app.","What did maintaining the reporting layer involve week to week?"],
 terms:["Scoped application","Update set","Delivery visibility"],
 avoid:["Claiming production development","Letting 'maintaining' imply platform administration"],

 followups:["GET versus POST versus PATCH?","What is a spoke, precisely?","How would you secure an inbound integration?"],

{id:"b10",bank:"B",band:"Technical spine",label:"Explain",q:"Explain SOAP web services and your experience with them.",

 structure:"None first, then a correct compact concept, framed as understanding.",
 a30:"No hands-on SOAP experience. Conceptually: XML-based web services with a formal contract, the WSDL, strongly typed envelopes, and operations, heavier than REST's resource-and-verb model. Legacy and government systems still speak it, which is why it stays on requirement lists.",
 a60:"I have no documented SOAP experience, so let me give you understanding rather than a pretended history. SOAP is XML-based messaging with a formal service contract, the WSDL, which defines operations and types; requests travel as structured envelopes, and the strictness buys you contract validation at the cost of weight. REST took over because resources, verbs, and JSON are lighter, but SOAP persists in legacy and government integrations, and ServiceNow can consume and expose both, which I know from the platform's integration training context.",
 a120:null,maxNote:"Sixty seconds of accurate concept beats two minutes of pretend experience.",
 followups:["What is a WSDL?","When would SOAP beat REST today?","Has ServiceNow deprecated either?"],
 terms:["WSDL","Envelope","Contract-first"],

{id:"b11",bank:"B",band:"Technical spine",label:"Explain",q:"Explain object-oriented programming principles.",
 testing:"Whether the academic base is real and current enough to explain cleanly.",
 jd:"Required: \"Solid understanding of ... object-oriented programming principles.\"",
 evidence:[{t:"C/C++ Programming coursework, Information Systems minor.",tier:"STUDIED"}],
 structure:"The four principles with one concrete line each, then the tier.",
 a30:"Encapsulation: data and behavior bound together with controlled access. Inheritance: specialized classes extending general ones. Polymorphism: one interface, many implementations. Abstraction: exposing what a thing does, hiding how. My base is C++ coursework, and I keep it labeled academic.",
 a60:"Four principles, concretely. Encapsulation: a class owns its data and exposes controlled methods, so state cannot be corrupted from outside. Inheritance: specialized types extend a general one, a SafetyIssue extending Task, to reuse structure and behavior. Polymorphism: callers use one interface while different classes provide different implementations underneath. Abstraction: you program against what something does, not how. That maps directly onto ServiceNow's data model, where tables extend tables and task is the great parent class, which is one reason the platform felt legible to me. My foundation is C and C++ coursework, academic and labeled as such.",
 a120:null,maxNote:"Sixty seconds; deeper only if the interviewer pulls.",
 followups:["Give a platform example of inheritance.","Composition versus inheritance?","What OOP mistakes do beginners make?"],
 terms:["Encapsulation","Inheritance","Polymorphism","Abstraction"],
 avoid:["Claiming professional software engineering"],
 practice:"Four principles, four sentences, no notes.",srcs:["Requirement r10","Resume coursework"]},

{id:"b14",bank:"B",band:"Technical spine",label:"Defend",q:"How have you supported DevSecOps practices?",

 evidence:[{t:"Release and maintenance coordination on TDL-064: deliverable reviews, acceptance and invoicing readiness, DD250/MIRR planning, security-support workstream, DD Form 254 support.",tier:"TRANSFER"}],

 a30:"From the coordination side: on TDL-064 I ran deliverable reviews, acceptance readiness, DD250 and MIRR planning, and the security-support workstream with DD Form 254 requirements, sequencing software delivery into a secure federal environment. I have not engineered CI/CD pipelines; my role was governing release and maintenance, not building the tooling.",
 a60:"I support the release-and-maintenance half of that phrase from the program side, in a security-first environment. On TDL-064: deliverable reviews and validation coordination, acceptance and invoicing readiness, DD250 and MIRR planning, PO and CO routing, and a security-support workstream carrying DD Form 254 requirements, all of it sequencing hardware-in-the-loop and software work into a controlled federal baseline. That is the Sec and the Ops parts as governance. The boundary: I have not built or operated CI/CD pipelines, and I will not present release coordination as pipeline engineering. If the team's DevSecOps need is discipline, evidence, and secure release governance, that is documented; if it is toolchain construction, that is not my record.",

{id:"b15",bank:"B",band:"Platform build",label:"Explain",q:"Describe your App Engine Studio experience.",
 testing:"Your most demonstrable JD-matching artifact. Depth, specificity, and the PDI label.",
 jd:"Required: \"Experience with ServiceNow App Engine Studio and Creator Studio.\"",
 evidence:[{t:"Scoped safety application, Zurich PDI: custom table, two roles, seven ACLs, row and field security, impersonation testing, form/list configuration, update set. Public on GitHub.",tier:"PDI"},{t:"Documented lab record with verification evidence dated August 7, 2026.",tier:"PDI"}],
 structure:"What you built, the security model in detail, how you verified it, the label.",
 a30:"I built a scoped safety-issue application in App Engine Studio in my Zurich PDI: custom table, two roles, seven ACLs with row and field security, form and list configuration, packaged as an update set and public on GitHub. I verified the security model by impersonation testing. It is lab work, and I label it that way.",
 a60:"Concretely: a scoped safety-issue tracking application, built in App Engine Studio in my Zurich PDI and public on GitHub. Custom table for safety issues; two roles, a user role for agents and an admin role for managers, attached through groups; seven ACLs implementing the security model. The interesting part is the row-level rule: agents' read ACL carries a data condition, assigned-to is dynamic Me, so an agent sees only their own issues, while the manager read ACL has an empty condition and sees everything, because any matching read rule grants access. A field-level ACL hides manager notes from agents, and delete is restricted to the manager role. I verified all of it by impersonating each test user and checking exact record counts and field visibility, then packaged the app as an importable update set. PDI work, not production, and I say so unprompted when it matters.",
 a120:"I will walk it as a build review. Purpose: a safety-issue tracker, built as a scoped application so everything, table, roles, ACLs, lives in its own namespace. Data: one custom table for safety issues with an assigned-to reference. Security model, which is the part I am proudest of: two roles, a user role for agents and an admin role for managers, granted through groups so membership drives permissions; seven ACLs in total. The core is two read rules on the same table that work together: the agent rule requires the user role and carries a data condition, assigned-to is dynamic Me, meaning the logged-in user; the manager rule requires the admin role with an empty condition. Because the platform grants read if any rule passes, agents see exactly their own records and managers see all of them. On top of that, a field-level ACL protects the manager-notes field from agents, and delete is restricted to managers. Verification: I impersonated each test user and confirmed the exact behavior, the agent seeing only their two assigned records with the protected field hidden and no delete button, the manager seeing all records, both fields, and delete. I also hit the real-world gotchas, like the platform dropping a dynamic condition on first save, which taught me to reopen and verify every ACL after saving. Packaged as an update set, public on GitHub. All of it is PDI lab work on the Zurich release, and that label is part of the answer.",
 maxNote:null,
 followups:["Why does the manager rule need an empty condition?","What broke during the build?","Why an update set instead of just screenshots?"],
 terms:["Scoped app","Row-level security","Dynamic condition","Impersonation","Update set"],
 avoid:["Letting it read as production deployment","Vagueness; this one must be specific"],
 practice:"Whiteboard the model from memory: table, two roles, two read rules, field rule, delete rule.",srcs:["Requirement r14","Resume portfolio line","PDI ACL lab record"]},

{id:"b22",bank:"B",band:"Modules",label:"Explain",q:"Tell me about your Incident and Problem Management knowledge specifically.",
 testing:"Precision on the two most-used ITSM objects.",
 jd:"Required modules: \"Incident/Problem Management.\"",
 evidence:[{t:"Administration Fundamentals coursework.",tier:"STUDIED"}],
 structure:"Definitions with the distinction, lifecycle sketch, boundary.",
 a30:"From coursework: an incident is an unplanned interruption, and the goal is restoring service fast; a problem is the underlying cause of one or more incidents, and the goal is permanent fix. Incidents get resolved, problems get root-caused, and known errors carry workarounds until the fix lands.",
 a60:"From coursework, with the distinction that matters: incident management restores service, problem management prevents recurrence. An incident is the interruption itself; you triage by impact and urgency, restore service, and close. A problem is the cause underneath, often opened when incidents cluster; you root-cause it, and until the permanent fix ships, a known error with a workaround keeps the service desk fast. The two connect on the platform through related records, and both live on the task backbone, so assignment, SLAs, and reporting behave consistently. My tier: studied through Administration Fundamentals, not operated in production.",
 a120:null,maxNote:"Sixty seconds.",
 followups:["What is a known error?","Impact versus urgency versus priority?","When would you open a problem from an incident?"],
 terms:["Known error","Impact/urgency/priority","Workaround"],
 avoid:["Operational anecdotes you do not have"],
 practice:"One sentence each: incident, problem, known error.",srcs:["Requirement r16"]},

{id:"b23",bank:"B",band:"Modules",label:"Explain",q:"Describe your ServiceNow reporting experience.",
 testing:"Your strongest JD-required module. Depth expected; this is where you spend.",
 jd:"Required modules: \"Reporting.\"",
 evidence:[{t:"Production dashboard and reporting layer on TDL-064: interactive filters, KPIs, drill-down, executive and PM audiences.",tier:"PROD"}],
 structure:"Lead with production, walk one artifact end to end, name the data-discipline lesson.",
 a30:"This is my strongest module, and it is production evidence: I built and maintained the leadership reporting layer on TDL-064, interactive filters for task order, business unit, and contract period, KPIs for open, closed, overdue, and near-due milestones, and drill-down into project records, serving executives and PMs from one page.",
 a60:"Production evidence, so let me be specific. On TDL-064 I built and maintained the leadership reporting layer: interactive filters for task order, business unit, and contract period; current-state KPIs, open, closed, overdue, and near-due milestones; progress views; and drill-down from any number into the underlying records. One page served executives and project managers, filters changing the view, so there was one version of the truth. The lesson I carry into any reporting work: standardize the record structure first, we standardized deliverables as weighted milestones in a consistent WBS, or the dashboard lies. Boundary: the integrations feeding those records were not mine, and my claim is the reporting layer I can reconstruct end to end.",
 a120:null,maxNote:"Sixty seconds here; the full build story lives in the dashboards module and the challenge story.",
 followups:["Report versus dashboard versus workspace?","How did you control who saw what?","What is your data-quality tell on a suspicious KPI?"],
 terms:["Interactive filter","KPI","Drill-down"],
 avoid:["Claiming Performance Analytics","Claiming the feeding integrations"],
 practice:"Walk the overdue-milestone KPI chain aloud in 30 seconds.",srcs:["Requirement r21","Prepared Q8"]},

{id:"b24",bank:"B",band:"Modules",label:"Explain",q:"What Configuration Management and CMDB experience do you have?",

 structure:"Tier, correct concepts including CSDM, boundary.",
 a30:"Conceptual, from training: the CMDB stores configuration items and their relationships, and CSDM is the prescribed model for structuring that data, a standard you conform to, not an application you install. I have not populated or governed a production CMDB.",
 a60:"My tier is studied, and the concepts are solid. The CMDB is the repository: configuration items and the relationships between them, which is what makes impact analysis possible, this change touches this CI which supports this service. CSDM, the Common Service Data Model, is the prescribed standard for how you structure and relate that data; it is a conformance journey, not an installable product, and mistaking it for one is a known tell, so I do not. Conceptually I also understand the delivery seam I sat next to: deliverables and changes tying to CIs. What I have not done: discovery, CI population, data governance, or CMDB administration in production.",
 a120:null,maxNote:"Sixty seconds.",
 followups:["What is a CI class?","Why does CMDB data quality decay?","What does CSDM conformance actually involve?"],
 terms:["Configuration item","CI relationship","CSDM"],
 avoid:["Calling CSDM an app or integration","Claiming CMDB population or governance"],
 practice:"CSDM sentence again: the model, not the database.",srcs:["Requirement r22","Prepared Q10"]},

{id:"b25",bank:"B",band:"Working style",label:"Defend",q:"How do you approach customer service and continuous improvement?",
 testing:"Whether the orientation is demonstrated with evidence rather than asserted.",
 jd:"Required: \"Strong customer service orientation with a focus on continuous improvement.\"",
 evidence:[{t:"CIWT/CNATT: mapping current-state processes, identifying delivery inefficiencies, modernization with adoption and sustainment discipline.",tier:"PROD"},{t:"HPT practice: distinguishing training needs from process, resource, information, organizational, or technology barriers.",tier:"PROD"},{t:"96% graduation rate sustained while modernizing curriculum; 100% retention leading 64 people.",tier:"TRANSFER"}],
 structure:"The method, one concrete evidence line per half, stop.",
 a30:"My continuous-improvement method is diagnostic: map the current state, find the real barrier, and fix that, because half the time the problem is process or information, not technology. Customer service, to me, is the stakeholder seeing their problem understood and their time respected, and my programs run on that.",
 a60:"I run improvement as diagnosis, not enthusiasm. At CIWT and CNATT I map current-state processes, identify delivery inefficiencies, and use performance-technology discipline to distinguish a training problem from a process, resource, information, or technology barrier, because fixing the wrong one wastes everyone's year. Then adoption and sustainment get engineered, pilots, remediation, quality review, not assumed. Customer service is the same posture pointed outward: government stakeholders, end users, and subcontractors each get their constraints understood and their time respected, which is why my reporting work put one accurate page in front of everyone instead of making each audience ask.",
 a120:null,maxNote:"Sixty seconds with evidence beats two minutes of values talk.",
 followups:["Give an improvement you drove that failed first.","How do you handle a stakeholder who wants the wrong fix?","What does respect for the customer look like under deadline?"],
 terms:["Performance barrier analysis","Adoption and sustainment"],
 avoid:["Values assertions with no artifact attached"],
 practice:"Name one barrier-diagnosis example in two sentences.",srcs:["Requirement r23","Resume CIWT bullets"]},

{id:"b26",bank:"B",band:"Working style",label:"Defend",q:"How do you communicate with stakeholders at all levels?",
 testing:"Evidence-backed communication range.",
 jd:"Required: \"Excellent written and verbal communication skills with the ability to engage stakeholders at all levels.\"",
 evidence:[{t:"Executive briefings; CDRL-aligned reporting translating technical status into decisions.",tier:"PROD"},{t:"I/ITSEC 2025 author and invited presenter, NTSA-selected.",tier:"PROD"},{t:"Instructor leadership: 36 instructors supervised, 3,542 training hours delivered.",tier:"TRANSFER"}],
 structure:"The principle, then three tiers of evidence: executive, technical, instructional.",
 a30:"By translating, not broadcasting. Executives get decisions and risk posture; technical teams get specifics and dependencies; end users get what changes for them. Evidence: CDRL-grade reporting and executive briefs on federal programs, a national-conference presentation at I/ITSEC 2025, and years of instructor leadership.",
 a60:"My rule is that communication is translation: the same technical truth becomes a decision brief for an executive, a dependency conversation for an engineer, and an adoption message for an end user, and my job is keeping all three versions accurate to each other. The evidence spans the range: I author and approve CDRL-aligned program reporting that turns technical status and risk posture into executive decisions; I was selected by NTSA to present at I/ITSEC 2025, which is a room of skeptical professionals; and I spent years leading 36 instructors delivering thousands of training hours, which teaches you how understanding actually gets built. Written and verbal, formal and live, up and down the chain.",
 a120:null,maxNote:"Sixty seconds.",
 followups:["Tell me about delivering bad news upward.","How do you brief a technical dispute to a non-technical decision maker?","What was the I/ITSEC talk about?"],
 terms:["CDRL","Decision-ready reporting"],
 avoid:["Generic soft-skill claims without the artifacts"],
 practice:"One breath: translate, three audiences, three artifacts.",srcs:["Requirement r24","Resume"]},

{id:"b27",bank:"B",band:"Working style",label:"Defend",q:"How do you manage multiple priorities in a dynamic environment?",
 testing:"Evidence of real concurrent load, not time-management platitudes.",
 jd:"Required: \"Ability to manage multiple priorities in a dynamic environment and work independently or collaboratively.\"",
 evidence:[{t:"Concurrent roles: CIWT/CNATT portfolio May 2023 to present, plus TDL-064 Aug 2025 to May 2026.",tier:"PROD"},{t:"RAPCON watch supervision: 64-person team, 409K+ mishap-free operations.",tier:"TRANSFER"}],
 structure:"Name the concurrent load, the mechanism, then the collaborative/independent split.",
 a30:"With structure, not heroics. For ten months I ran a multi-workstream training portfolio and the TDL-064 task order concurrently, and the mechanism was WBS discipline, integrated schedules, and honest dependency tracking, so priority calls were visible instead of personal. Before that, air traffic control, where priority management is the entire job.",
 a60:"My evidence is concurrent load carried in public. From August 2025 to May 2026 I ran my CIWT and CNATT workstreams and the TDL-064 task order at the same time, and what made it work was structure: WBS-decomposed deliverables, integrated milestones and schedules, risk and dependency trackers, so when priorities collided the tradeoff was on paper and briefable, not a private judgment call. I work independently by default and collaboratively by design, multi-vendor IPT coordination is exactly that. And the deep foundation is air traffic control: a 64-person watch team through four hundred nine thousand mishap-free operations, which is priority management with consequences attached.",
 a120:null,maxNote:"Sixty seconds.",
 followups:["Describe a priority collision between the two roles and the call you made.","What do you drop first under overload?","How do stakeholders learn about a slip?"],
 terms:["Integrated master schedule","Dependency tracker"],
 avoid:["Time-management platitudes without the concurrent evidence"],
 practice:"Name the two concurrent roles and their dates without hesitation.",srcs:["Requirement r25","Resume"]},

{id:"b33",bank:"B",band:"Responsibilities",label:"Explain",q:"How would you design and implement a solution for a new feature or integration in ServiceNow?",
 testing:"Situational judgment: whether your method is real even where production mileage is not.",
 jd:"Key responsibility: \"Design and implement solutions to support new features, capabilities, and system integrations within ServiceNow.\"",
 evidence:[{t:"Configure-first design judgment (Q12); PDI build practice: scoped app, flow, security model, update set.",tier:"PDI"},{t:"Requirements-to-delivery translation discipline from program work.",tier:"PROD"}],
 structure:"Method in five steps, anchored to what you have actually practiced, honest about scale.",
 a30:"Requirements first: what decision or workflow is this serving, and who owns it. Then configure-first design: out-of-the-box, then declarative, custom only with justification. Build small in a sub-production instance, secure it with roles and ACLs from the start, verify by impersonation, and move it as an update set with documentation.",
 a60:"My method, which I have practiced at PDI scale. One: requirements, in the users' language, what workflow is being served, who owns it, what does done mean. Two: design under a configure-first rule, out-of-the-box capability, then declarative configuration, custom development only when a documented requirement cannot be met otherwise and the upgrade cost is accepted. Three: build in a non-production instance, scoped so it cannot leak. Four: security is design, not garnish, roles, ACLs, row and field conditions, verified by impersonating each persona before anyone asks. Five: package as an update set, document what and why, and test end to end before activation. That is exactly the shape of my safety-app and flow builds, and I am direct that my mileage is lab-scale while the method is production-shaped.",
 a120:null,maxNote:"Sixty seconds of method; scale honesty included.",
 followups:["Where does stakeholder signoff enter?","What would you do differently for an integration versus a feature?","How do you decide scoped versus global?"],
 terms:["Configure-first","Sub-production instance","Update set"],
 avoid:["Narrating production implementations you have not done"],
 practice:"Five steps, five fingers, out loud.",srcs:["Prepared Q12","PDI lab records"]},

{id:"b34",bank:"B",band:"Responsibilities",label:"Explain",q:"How would you approach configuring and maintaining ITSM, ITOM, and ITAM implementations following best practices?",
 testing:"Whether best practice means something operational to you.",
 jd:"Key responsibility: \"Configure, enhance, and maintain ServiceNow platform implementations across ITSM, ITOM, and ITAM modules following best practices.\"",
 evidence:[{t:"Configure-first judgment; update-set and impersonation discipline from PDI practice.",tier:"PDI"},{t:"Module knowledge tiers: ITSM studied, ITOM none, ITAM none, stated plainly.",tier:"STUDIED"}],
 structure:"Define best practice operationally, then apply, then the module-knowledge boundary.",
 a30:"Best practice, operationally: preserve out-of-the-box behavior, prefer declarative changes, document every deviation with its justification, move changes through update sets, test with the least-privileged persona, and protect upgradeability above cleverness. I would bring that discipline while being plain that my ITOM and ITAM knowledge is currently thin.",
 a60:"To me best practices are operational habits, not a poster. Preserve out-of-the-box behavior and prefer declarative configuration, because upgradeability is the asset. Every deviation gets a documented requirement and an owner who accepted its cost. Changes move through update sets between instances, never hand-edits in production. Security is tested as the least-privileged user, not as admin, which is why impersonation testing is in my routine already. And maintenance means watching what upgrades touch and retesting what matters. I will be equally plain about knowledge tiers: ITSM I know from coursework, ITOM and ITAM are currently gaps, so my first weeks there would be deliberate study of the implemented state before I changed anything.",
 a120:null,maxNote:"Sixty seconds; the honesty about ITOM/ITAM is part of the answer.",
 followups:["What does an upgrade break most often?","Why are hand-edits in production dangerous?","What would you study first for ITOM?"],
 terms:["Upgradeability","Update set discipline","Least privilege"],
 avoid:["Pretending module depth in ITOM or ITAM"],
 practice:"List the five habits from memory.",srcs:["Prepared Q12","Requirement rows r16 to r18"]},

{id:"b35",bank:"B",band:"Responsibilities",label:"Explain",q:"How would you develop automation solutions across the platform?",
 testing:"Automation thinking grounded in your actual Flow Designer practice.",
 jd:"Key responsibility: \"Develop automation and integration solutions across the ServiceNow platform.\"",
 evidence:[{t:"PDI Flow Designer build: trigger, approval, branching logic, record updates; error-handler and run-as knowledge.",tier:"PDI"},{t:"Process-mapping discipline: current state before automation.",tier:"PROD"}],
 structure:"Process first, then the build pattern you have practiced, then guardrails.",
 a30:"Process before platform: map the current state and find the step where automation removes real toil. Then the pattern I have practiced: a precise trigger, actions with explicit conditions, branching for the exception path, and an error handler so failure is visible. Run flows with least privilege, test in sub-production, activate deliberately.",
 a60:"I start where my program-improvement work always starts: the process, mapped as it actually runs, because automating a broken process just makes it fail faster. Then the build, in the pattern I have hands-on practice with: a precisely conditioned trigger, so the flow fires on the right records and nothing else; actions doing the work; flow logic carrying the exception path explicitly, my PDI flow branches If approved and Else with distinct record updates, because the rejection path deserves design too; and an error handler so failures surface instead of vanishing. Guardrails: run-as with least privilege, test against a real record in sub-production, and activate only after the end-to-end works, which for my own flow is the documented next step, and I say that rather than round it up.",
 a120:null,maxNote:"Sixty seconds, anchored to the practiced pattern.",
 followups:["When is Flow Designer the wrong tool?","How do you stop a runaway flow?","What belongs in a subflow?"],
 terms:["Trigger condition","Exception path","Least privilege"],
 avoid:["Rounding the draft flow up to activated","Claiming production automation"],
 practice:"Say the pattern: trigger, action, branch, error handler, guardrails.",srcs:["PDI Flow Designer lab record","Resume CIWT bullets"]},

{id:"b36",bank:"B",band:"Responsibilities",label:"Defend",q:"How do you align improvements with mission requirements and collaborate in a secure, mission-driven environment?",
 testing:"The two closing responsibilities together: mission alignment and cleared-environment collaboration.",
 jd:"Key responsibilities: \"Support ongoing system improvements aligned with mission and customer requirements\" and \"Collaborate with stakeholders to ensure effective delivery of technical solutions in a secure, mission-driven environment.\"",
 evidence:[{t:"Stakeholder requirements translation, government-furnished baselines, acceptance criteria alignment across 12-24 month periods.",tier:"PROD"},{t:"Security-embedded delivery: DD Form 254, security-support workstream, Top Secret clearance, 20+ years in classified environments.",tier:"PROD"}],
 structure:"Mission alignment mechanism, then security as habit, one evidence line each.",
 a30:"Mission alignment is traceability: every improvement traces to a stakeholder requirement, a baseline, and acceptance criteria, or it does not happen. And secure collaboration is my native environment: twenty-plus years cleared, DD Form 254 requirements handled inside delivery rather than around it, currently under an active Top Secret.",
 a60:"Alignment, for me, is a traceability habit: an improvement earns its place by tracing to a stakeholder requirement, a government-furnished baseline, and named acceptance criteria, which is how I have run 12-to-24-month periods of performance without drift. The customer's mission owns the priority stack; my reporting exists so they can see that it does. On the secure environment: that is not an adjustment for me, it is home. Twenty-plus years in cleared DoD settings, an active Top Secret, Derivative Classification current, and on TDL-064 the security-support workstream and DD Form 254 requirements ran inside the delivery plan, not as an afterthought. Collaboration in that world means precision about what moves where, and I am built for it.",
 a120:null,maxNote:"Sixty seconds.",
 followups:["Give an example of killing an improvement that did not trace to mission.","How do you collaborate when half the room lacks the clearance context?","What changes about delivery inside classification boundaries?"],
 terms:["Traceability","Government-furnished baseline","DD Form 254"],
 avoid:["Mission platitudes without the mechanism"],
 practice:"Say the traceability sentence and the native-environment sentence back to back.",srcs:["Resume CIWT and TDL-064 bullets"]}
];
const BANKB = BANKB1.concat(BANKB2);
const ALLQ = BANKA.concat(BANKB);

/* ================= APP LOGIC ================= */
const LSKEY = META.storageKey;
function loadS(){ try{ return JSON.parse(localStorage.getItem(LSKEY))||{} }catch(e){ return {} } }
let S = Object.assign({conf:{},mast:{},ok:{},mockHist:[],done:{},cardSel:{},diagDone:false},loadS());
function save(){ try{ localStorage.setItem(LSKEY,JSON.stringify(S)) }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;") }
const byId = {}; ALLQ.forEach(q=>byId[q.id]=q); DEFENSE.forEach(d=>byId[d.id]=d); REQS.forEach(r=>byId[r.id]=r);
const stack = [];
let view = "path", curId = null, qtab = "A", evtab = "table", mock = null;

function tierChip(t){ return '<span class="chip sm tier-'+esc(t)+'">'+esc(t)+'</span>' }
function tiersOf(x){ return (x.evidence?x.evidence.map(e=>e.tier):(x.tiers||[])).filter((v,i,a)=>a.indexOf(v)===i) }
function prov(kind){ if(kind==="S")return '<span class="prov S">SOURCED</span>'; if(kind==="C")return '<span class="prov C">DRAFT &middot; CONFIRMED BY YOU</span>'; return '<span class="prov D">DRAFT</span>' }
function statusChip(st){ const cls = st.indexOf("NOT")===0?"st-NOTMET":(st==="EXCEEDS"?"st-EXCEEDS":(st==="PARTIAL"?"st-PARTIAL":"")); if(cls)return '<span class="chip sm '+cls+'">'+esc(st)+'</span>'; return (st.split(" / ").map(t=>TIERS[t]?tierChip(t):'<span class="chip sm">'+esc(st)+'</span>')).join("") }
function riskOf(x){ const t=tiersOf(x); if(t.indexOf("NONE")>=0)return "HIGH"; if(t.indexOf("PROD")>=0)return "LOW"; return "MEDIUM" }
function rateRow(map,id,label){ const v=S[map][id]||0; let h='<div class="row" style="margin-top:6px"><span class="pill">'+label+'</span><div class="rate" role="group" aria-label="'+label+' 1 to 5">';
 for(let i=1;i<=5;i++){ h+='<button class="chip" aria-pressed="'+(v===i)+'" onclick="setRate(\''+map+'\',\''+id+'\','+i+')">'+i+'</button>' }
 return h+'</div></div>' }
function setRate(map,id,v){ S[map][id]=(S[map][id]===v?0:v); save(); render() }
function toggleOk(key){ S.ok[key]=!S.ok[key]; save(); render() }
function toggleDone(id){ S.done[id]=!S.done[id]; save(); render() }
function toggleCard(key){ S.cardSel[key]=!S.cardSel[key]; save(); render() }

function go(v,id,tab){ stack.push({view:view,curId:curId,qtab:qtab,evtab:evtab}); view=v; curId=id||null; if(tab)qtab=tab; window.scrollTo(0,0); render() }
function goBack(){ const p=stack.pop(); if(p){ view=p.view; curId=p.curId; qtab=p.qtab; evtab=p.evtab } else { view="path"; curId=null } render() }
function setQtab(t){ qtab=t; render() }
function setEvtab(t){ evtab=t; render() }

function confCount(){ return Object.keys(S.conf).filter(k=>S.conf[k]>0).length }
function blockAvg(b){ const vs=b.items.map(i=>S.conf[i]||0).filter(v=>v>0); return vs.length?vs.reduce((a,c)=>a+c,0)/vs.length:0 }
function weakestBlock(){ let w=null,wv=9; PATH.forEach(b=>{ if(b.items.length){ const a=blockAvg(b)||9; if(a<wv){wv=a;w=b} } }); return w }
function rPath(){
 const total=PATH.reduce((a,b)=>a+b.min,0); const doneMin=PATH.filter(b=>S.done[b.id]).reduce((a,b)=>a+b.min,0);
 let h='<p class="note">'+esc(META.purpose)+'</p>';
 h+='<div class="card pad"><div class="lbl">The three-date chronology '+prov("S")+'</div>'+svgChron()+'</div>';
 h+='<div class="card pad"><div class="lbl">One-day path: about nine hours including breaks</div><div class="bar" aria-label="Path progress"><i style="width:'+Math.round(doneMin/total*100)+'%"></i></div><div class="cap">'+doneMin+' of '+total+' minutes marked complete. This bar is the path timeline visual: preparation progress only.</div></div>';
 h+='<div class="card">';
 PATH.forEach(b=>{
  const avg=blockAvg(b); let adapt="";

const CRIT=["Accuracy","Evidence fidelity","Concision","Natural delivery","Boundary discipline"];
function pickMock(n){
 function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t } return a }
 const bandsA={}; BANKA.forEach(q=>{(bandsA[q.band]=bandsA[q.band]||[]).push(q)});
 const bandsB={}; BANKB.forEach(q=>{(bandsB[q.band]=bandsB[q.band]||[]).push(q)});
 let picks=[];
 Object.keys(bandsA).forEach(b=>picks.push(shuffle(bandsA[b].slice())[0]));
 Object.keys(bandsB).forEach(b=>picks.push(shuffle(bandsB[b].slice())[0]));
 picks=picks.slice(0,n);
 const weak=lastWeakItems(); weak.slice(0,2).forEach(id=>{ if(!picks.some(p=>p.id===id)&&byId[id]&&byId[id].q)picks.unshift(byId[id]) });
 return picks.slice(0,n);
}
function startMock(n){ mock={items:pickMock(n).map(q=>({id:q.id,scores:{},followup:null})),i:0,phase:"ask",t:null,left:0}; render() }
function mockTimer(sec){ const it=mock; it.left=sec; clearInterval(it.t);
 it.t=setInterval(()=>{ it.left--; const el=document.getElementById("mtimer"); if(el){ el.textContent=Math.floor(it.left/60)+":"+String(Math.max(0,it.left%60)).padStart(2,"0"); el.classList.toggle("low",it.left<=10) } if(it.left<=0){ clearInterval(it.t); const el2=document.getElementById("mtimer"); if(el2)el2.textContent="time" } },1000); render() }
function mockReveal(){ const q=byId[mock.items[mock.i].id]; mock.items[mock.i].followup=q.followups[Math.floor(Math.random()*q.followups.length)]; mock.phase="follow"; clearInterval(mock.t); render() }
function mockScorePhase(){ mock.phase="score"; render() }
function setMockScore(ci,v){ mock.items[mock.i].scores[ci]=v; render() }
function mockNext(){ clearInterval(mock.t); if(mock.i<mock.items.length-1){ mock.i++; mock.phase="ask"; render() } else { mock.phase="done"; S.mockHist.push({when:new Date().toISOString(),items:mock.items}); save(); render() } }
function rMock(){
 if(!mock||mock.phase==="setup"){
  const last=S.mockHist.length?'<div class="card pad"><div class="lbl">Last session</div>'+mockSummaryTable(S.mockHist[S.mockHist.length-1])+'</div>':"";
  return '<p class="note">Realistic simulation from both banks, randomized within band. A visible timer enforces concise speaking. You score yourself against explicit criteria; scores describe answer quality only, and no overall recommendation is ever produced from them.</p>'
  +'<div class="card pad"><div class="lbl">Start a session</div><div class="row" style="margin-top:8px"><button class="btn acc" onclick="startMock(6)">6 questions</button><button class="btn acc" onclick="startMock(8)">8 questions</button><button class="btn acc" onclick="startMock(10)">10 questions</button></div><div class="cap">Weak items from your last session are folded back in automatically.</div></div>'+last;
 }
 if(mock.phase==="done"){ const h=S.mockHist[S.mockHist.length-1];
  return '<h2>Session complete</h2><p class="note">Answer-quality scores only. Items with any criterion at 2 or below are routed to Targeted Remediation on the Path.</p><div class="card pad">'+mockSummaryTable(h)+'</div><button class="btn acc" onclick="mock=null;render()">Close session</button>';
 }
 const it=mock.items[mock.i], q=byId[it.id];
 let h='<div class="card pad"><div class="row"><span class="chip sm">Question '+(mock.i+1)+' of '+mock.items.length+'</span><span class="num">'+q.id.toUpperCase()+'</span>'+tiersOf(q).map(tierChip).join("")+'</div><h2>'+esc(q.q)+'</h2>';
 if(mock.phase==="ask"){
  h+='<div class="timer" id="mtimer" aria-live="off">'+(mock.left?Math.floor(mock.left/60)+":"+String(mock.left%60).padStart(2,"0"):"--:--")+'</div>';
  h+='<div class="row"><button class="btn" onclick="mockTimer(30)">30s</button><button class="btn" onclick="mockTimer(60)">60s</button><button class="btn" onclick="mockTimer(120)">120s</button></div>';
  h+=recorderUI();
  h+='<div class="row" style="margin-top:12px"><button class="btn acc" onclick="mockReveal()">I answered: challenge me</button></div>';
 } else if(mock.phase==="follow"){
  h+='<div class="warnbox"><strong>Follow-up:</strong> '+esc(it.followup)+'</div>';
  h+='<div class="row" style="margin-top:12px"><button class="btn acc" onclick="mockScorePhase()">Score myself</button></div>';
 } else if(mock.phase==="score"){
  h+='<div class="sec"><div class="lbl">Self-score (1 weak to 5 strong)</div>';
  CRIT.forEach((c,ci)=>{ h+='<div class="row" style="margin:6px 0"><span class="pill" style="min-width:150px">'+c+'</span><div class="rate">'; for(let v=1;v<=5;v++){ h+='<button class="chip" aria-pressed="'+(it.scores[ci]===v)+'" onclick="setMockScore('+ci+','+v+')">'+v+'</button>' } h+='</div></div>' });
  h+='</div><div class="cap">Confidence check: you rated this item '+(S.conf[it.id]||0)+'/5 before practicing. Confidence that materially exceeds performance triggers targeted review.</div>';
  h+='<div class="row" style="margin-top:12px"><button class="btn acc" onclick="mockNext()">'+(mock.i<mock.items.length-1?"Next question":"Finish session")+'</button><button class="btn ghost" onclick="go(\'questions\',\''+q.id+'\')">Open module</button></div>';
 }
 return h+'</div>';
}
function mockSummaryTable(h){
 let t='<div class="twrap"><table><tr><th>Item</th>'+CRIT.map(c=>'<th>'+c+'</th>').join("")+'<th>Weak?</th></tr>';
 h.items.forEach(it=>{ const weak=Object.values(it.scores||{}).some(v=>v>0&&v<=2);
  t+='<tr><td>'+it.id.toUpperCase()+'</td>'+CRIT.map((c,ci)=>'<td>'+(it.scores[ci]||"-")+'</td>').join("")+'<td>'+(weak?"review":"")+'</td></tr>' });
 return t+'</table></div><div class="cap">Per-answer quality only. Nothing on this table aggregates into any overall figure.</div>';
}
/* Voice recording: feature-detected, degrades by absence */
let mediaRec=null,chunks=[],recURL=null;
function recorderUI(){ if(!(window.MediaRecorder&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return "";
 return '<div class="sec"><div class="lbl">Voice practice (optional, stays on this device, not saved after you leave)</div><div class="row">'
 +'<button class="btn" data-noauto="1" id="recbtn" onclick="recToggle()">Start recording</button>'
 +(recURL?'<audio controls src="'+recURL+'"></audio>':"")+'</div><div class="cap" id="recmsg"></div></div>' }
function recToggle(){ const btn=document.getElementById("recbtn"),msg=document.getElementById("recmsg");
 if(mediaRec&&mediaRec.state==="recording"){ mediaRec.stop(); return }
 navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{ chunks=[]; mediaRec=new MediaRecorder(st);
  mediaRec.ondataavailable=e=>chunks.push(e.data);
  mediaRec.onstop=()=>{ st.getTracks().forEach(t=>t.stop()); if(recURL)URL.revokeObjectURL(recURL); recURL=URL.createObjectURL(new Blob(chunks)); render() };
  mediaRec.start(); btn.textContent="Stop recording";
 }).catch(()=>{ if(msg)msg.textContent="Microphone unavailable in this browser session; practice aloud without recording." }) }
/* ---------- Review ---------- */
function calibrationAlerts(){
 const out=[]; const last=S.mockHist[S.mockHist.length-1]; if(!last)return out;
 last.items.forEach(it=>{ const vs=Object.values(it.scores||{}).filter(v=>v>0); if(!vs.length)return;
  const avg=vs.reduce((a,c)=>a+c,0)/vs.length, c=S.conf[it.id]||0;
  if(c-avg>=2)out.push({id:it.id,conf:c,avg:avg.toFixed(1)}) });
 return out;
}
function cardChk(key,label){ return '<div class="checkrow"><input type="checkbox" id="ck'+esc(key)+'" '+(S.cardSel[key]?"checked":"")+' onchange="toggleCard(\''+key+'\')"><label for="ck'+esc(key)+'">'+label+'</label></div>' }
function rReview(){
 let h='<p class="note">Low-load final review. Nothing new is introduced here; it only surfaces what you already worked. Check items to build your interview-day card.</p>';
 const cal=calibrationAlerts();
 if(cal.length)h+='<div class="warnbox"><strong>Calibration review suggested:</strong> confidence materially exceeded self-scored performance on: '+cal.map(c=>c.id.toUpperCase()+" (conf "+c.conf+", scored "+c.avg+")").join("; ")+'. Revisit those modules.</div>';
 const sel=Object.keys(S.cardSel).filter(k=>S.cardSel[k]);
 if(sel.length){ h+='<div class="card pad"><div class="lbl">My interview-day card ('+sel.length+')</div>';
  sel.forEach(k=>{ h+='<div class="txt" style="padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px">'+esc(cardText[k]||k)+'</div>' }); h+='</div>' }
 function section(title,items,prefix,provK){ let s='<h2>'+esc(title)+' <span class="prov '+provK+'" style="vertical-align:middle">'+(provK==="S"?"SOURCED":"DRAFT")+'</span></h2><div class="card pad">';
  items.forEach((t,i)=>{ const key=prefix+i; cardText[key]=t; s+=cardChk(key,esc(t)) }); return s+'</div>' }
 h+=section("Essential role requirements",RAPID.essentials,"ess","S");
 h+='<h2>Highest-consequence questions</h2><div class="card pad">'+RAPID.highConsequence.map(id=>'<button class="qh" onclick="go(\'questions\',\''+id+'\')"><span class="num">'+id.toUpperCase()+'</span><span class="qt" style="align-self:center">'+esc(byId[id].q||"")+'</span></button>').join("")+'</div>';
 h+=section("Response-opening cues",RAPID.openers.map(o=>o.q+" : "+o.cue),"opn","D");
 h+=section("Core experience examples",RAPID.coreExamples,"cex","S");
 h+=section("Key facts and figures",RAPID.keyFacts,"fct","S");
 h+=section("Technical concept summaries",RAPID.concepts,"cpt","D");
 h+=section("Memory anchors",RAPID.anchors,"anc","D");
 h+=section("Honest uncertainty language",RAPID.uncertainty,"unc","D");
 h+=section("Composure and pacing",RAPID.composure,"cmp","D");
 h+=section("Questions to ask the interviewer",RAPID.askThem,"ask","D");
 h+='<h2>Closing statement <span class="prov D">DRAFT</span></h2><div class="card pad">'+answerBlock({id:"closing"},"c","Spoken closing",RAPID.closing)+cardChk("closing","Add closing statement to my card")+'</div>';
 cardText["closing"]="Closing: "+RAPID.closing;
 return h;
}
const cardText={};
/* ---------- Search ---------- */
let lastQuery="";
function rSearch(){ return '<p class="note">Searches every content string in the app, including text not currently on screen. Built for the acceptance checks: any date you search must surface only correctly categorized evidence, hours must read only as more than 36, and no held ServiceNow certification may appear.</p><input type="search" id="sq" placeholder="Search all content..." oninput="doSearch(this.value)" aria-label="Search all content"><div id="sres" style="margin-top:12px"></div>' }
function collectStrings(){
 const out=[];
 ALLQ.forEach(q=>{ ["q","testing","jd","structure","a30","a60","a120","maxNote","practice"].forEach(f=>{ if(q[f])out.push({id:q.id,where:q.id.toUpperCase()+" "+f,t:q[f]}) });
  q.evidence.forEach(e=>out.push({id:q.id,where:q.id.toUpperCase()+" evidence",t:e.t}));
  q.followups.forEach(t=>out.push({id:q.id,where:q.id.toUpperCase()+" follow-up",t:t}));
  q.avoid.forEach(t=>out.push({id:q.id,where:q.id.toUpperCase()+" avoid",t:t})) });
 REQS.forEach(r=>["req","jd","notes","resp","status"].forEach(f=>{ if(r[f])out.push({id:r.id,where:r.id.toUpperCase(),t:r[f]}) }));
 DEFENSE.forEach(d=>["claim","evidence","context","role","tools","results","boundary","defense","gap"].forEach(f=>{ if(d[f])out.push({id:d.id,where:d.id.toUpperCase()+" "+f,t:d[f]}) }));
 Object.keys(RAPID).forEach(k=>{ const v=RAPID[k]; if(typeof v==="string")out.push({id:null,where:"Review "+k,t:v}); if(Array.isArray(v))v.forEach(x=>out.push({id:null,where:"Review "+k,t:(typeof x==="string"?x:x.q+" "+x.cue)})) });
 CHRON.forEach(c=>out.push({id:null,where:"Chronology",t:c.d+" "+c.t+" "+c.note}));
 PATH.forEach(p=>out.push({id:null,where:"Path",t:p.title+" "+p.desc}));
 return out;
}
function doSearch(qs){ lastQuery=qs; const box=document.getElementById("sres"); if(!box)return;
 const q=(qs||"").trim().toLowerCase(); if(q.length<2){ box.innerHTML='<p class="note">Type at least 2 characters.</p>'; return }
 const hits=collectStrings().filter(s=>s.t.toLowerCase().indexOf(q)>=0).slice(0,120);
 box.innerHTML='<p class="note">'+hits.length+' match'+(hits.length===1?"":"es")+(hits.length===120?" (first 120 shown)":"")+'.</p>'
 +hits.map(hh=>{ const i=hh.t.toLowerCase().indexOf(q); const a=Math.max(0,i-70), b=Math.min(hh.t.length,i+q.length+90);
  const snip=esc(hh.t.slice(a,i))+'<mark>'+esc(hh.t.slice(i,i+q.length))+'</mark>'+esc(hh.t.slice(i+q.length,b));
  return '<div class="card"><button class="qh" '+(hh.id?'onclick="go(\''+(hh.id[0]==="r"?"evidence":"questions")+'\',\''+hh.id+'\')"':'onclick="void(0)" style="cursor:default"')+'><span style="flex:1"><span class="meta" style="margin-bottom:4px"><span class="chip sm">'+esc(hh.where)+'</span></span><span class="txt" style="font-size:13px">'+(a>0?"...":"")+snip+(b<hh.t.length?"...":"")+'</span></span></button></div>' }).join("");
}
/* ---------- boot ---------- */
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("./service-worker.js").catch(()=>{}) }) }
render();

</script></body></html>
